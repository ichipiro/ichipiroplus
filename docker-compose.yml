services:
  postgres:
    image: postgres:17-alpine
    container_name: ichipiroplus-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ichipiroplus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: ichipiroplus-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

volumes:
  postgres_data:
    name: ichipiroplus_postgres_data
