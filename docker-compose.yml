services:
  minio:
    image: minio/minio:latest
    container_name: ichipiroplus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ichipiroplus_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 1s
      retries: 10

  minio-init-buckets:
    image: minio/mc:latest
    container_name: ichipiroplus-minio-init-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        set -eu;
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        buckets=$$(printf "%s" "$$MINIO_BUCKETS" | tr "," " ");
        for b in $$buckets; do
          [ -z "$$b" ] && continue;
          mc mb --ignore-existing "local/$$b" || true;
        done;
        echo "buckets ensured";
      '
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKETS: "test"
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: ichipiroplus-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ichipiroplus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: ichipiroplus_postgres_data
  ichipiroplus_minio_data:
    name: ichipiroplus_minio_data
